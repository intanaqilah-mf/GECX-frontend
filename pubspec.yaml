name: gecx_banking_acn
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  http: ^1.2.0
  intl: ^0.19.0
  webview_flutter: ^4.4.2
  webview_flutter_web: ^0.2.3
  webview_flutter_android: ^3.0.0
  webview_flutter_wkwebview: ^3.0.0
  image_picker: ^1.1.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  firebase_auth: ^5.0.0       # anon auth needed by Firestore rules on writes
  cloud_firestore: ^5.0.0     # QR Pay writes debit + credit directly
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  mobile_scanner: ^5.2.3   # Scan tab — QR / barcode detection
  local_auth: ^2.3.0       # Biometric (Face ID / Touch ID / fingerprint) login
  app_links: ^6.0.0        # Native deep links (Android intent / iOS universal links)
  qr_flutter: ^4.1.0       # "My QR" screen — renders the payer-scannable code
  zxing2: ^0.2.3           # Pure-Dart QR decoder for gallery pick (web-safe)
  image: ^4.1.7            # Decode picked-image bytes for the zxing2 scanner
  share_plus: ^10.0.0      # QR receipt Share button (Android / iOS / web)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/backend/index.html
    - lib/assets/
